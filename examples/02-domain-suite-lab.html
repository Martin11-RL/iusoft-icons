  <script>
    (function () {
      const DEG = Math.PI / 180;
      const fmt = (n) => Number(n.toFixed(3));

      function circlePath(cx, cy, r) {
        const x = fmt(cx);
        const yTop = fmt(cy - r);
        const yBot = fmt(cy + r);
        const rad = fmt(r);
        return `M ${x} ${yTop} A ${rad} ${rad} 0 1 1 ${x} ${yBot} A ${rad} ${rad} 0 1 1 ${x} ${yTop} Z`;
      }

      function capsulePath(x1, y1, x2, y2, r) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ex = dx / len;
        const ey = dy / len;
        const nx = -ey;
        const ny = ex;
        const b1x = fmt(x1 - r * nx), b1y = fmt(y1 - r * ny);
        const b2x = fmt(x2 - r * nx), b2y = fmt(y2 - r * ny);
        const a2x = fmt(x2 + r * nx), a2y = fmt(y2 + r * ny);
        const a1x = fmt(x1 + r * nx), a1y = fmt(y1 + r * ny);
        const rad = fmt(r);
        return `M ${b1x} ${b1y} L ${b2x} ${b2y} A ${rad} ${rad} 0 0 1 ${a2x} ${a2y} L ${a1x} ${a1y} A ${rad} ${rad} 0 0 1 ${b1x} ${b1y} Z`;
      }

      function roundedRectPath(x, y, w, h, r) {
        const rad = fmt(Math.min(r, w / 2, h / 2));
        return [
          `M ${fmt(x + r)} ${fmt(y)}`,
          `L ${fmt(x + w - r)} ${fmt(y)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(x + w)} ${fmt(y + r)}`,
          `L ${fmt(x + w)} ${fmt(y + h - r)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(x + w - r)} ${fmt(y + h)}`,
          `L ${fmt(x + r)} ${fmt(y + h)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(x)} ${fmt(y + h - r)}`,
          `L ${fmt(x)} ${fmt(y + r)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(x + r)} ${fmt(y)} Z`
        ].join(" ");
      }

      /**
       * Desplazamiento paralelo interior exacto (inset >= 0) sobre polígonos cerrados con empalmes circulares
       * convexos (r - inset) y cóncavos (r + inset), preservando centros y tangencia C¹.
       */
      function roundedPolyPath(pts, radii, inset) {
        const ins = inset || 0;
        const n = pts.length;
        const fillets = [];
        for (let i = 0; i < n; i++) {
          const pPrev = pts[(i - 1 + n) % n];
          const pCurr = pts[i];
          const pNext = pts[(i + 1) % n];
          const rBase = radii[i];

          const vInX = pCurr[0] - pPrev[0], vInY = pCurr[1] - pPrev[1];
          const lIn = Math.hypot(vInX, vInY);
          const uInX = vInX / lIn, uInY = vInY / lIn;

          const vOutX = pNext[0] - pCurr[0], vOutY = pNext[1] - pCurr[1];
          const lOut = Math.hypot(vOutX, vOutY);
          const uOutX = vOutX / lOut, uOutY = vOutY / lOut;

          const nInX = -uInY, nInY = uInX;
          const nOutX = -uOutY, nOutY = uOutX;

          const cross = uInX * uOutY - uInY * uOutX;
          const dot = Math.max(-1, Math.min(1, (-uInX) * uOutX + (-uInY) * uOutY));
          const halfAng = Math.acos(dot) / 2;
          const dTan = rBase / Math.tan(halfAng);
          const t1BaseX = pCurr[0] - dTan * uInX;
          const t1BaseY = pCurr[1] - dTan * uInY;

          if (cross > 0) {
            const cx = t1BaseX + rBase * nInX;
            const cy = t1BaseY + rBase * nInY;
            const rEff = rBase - ins;
            fillets.push({
              t1x: cx - rEff * nInX,
              t1y: cy - rEff * nInY,
              t2x: cx - rEff * nOutX,
              t2y: cy - rEff * nOutY,
              rEff,
              sweep: 1
            });
          } else {
            const cx = t1BaseX - rBase * nInX;
            const cy = t1BaseY - rBase * nInY;
            const rEff = rBase + ins;
            fillets.push({
              t1x: cx + rEff * nInX,
              t1y: cy + rEff * nInY,
              t2x: cx + rEff * nOutX,
              t2y: cy + rEff * nOutY,
              rEff,
              sweep: 0
            });
          }
        }

        const out = [`M ${fmt(fillets[0].t1x)} ${fmt(fillets[0].t1y)}`];
        for (let i = 0; i < n; i++) {
          const f = fillets[i];
          if (i > 0) out.push(`L ${fmt(f.t1x)} ${fmt(f.t1y)}`);
          out.push(`A ${fmt(f.rEff)} ${fmt(f.rEff)} 0 0 ${f.sweep} ${fmt(f.t2x)} ${fmt(f.t2y)}`);
        }
        out.push("Z");
        return out.join(" ");
      }

      /**
       * Manubrio acodado cápsula para la moto de reparto.
       */
      function bentHandlebarPath(pGrip, pElbow, pBase, r) {
        const v1x = pElbow[0] - pGrip[0], v1y = pElbow[1] - pGrip[1];
        const l1 = Math.hypot(v1x, v1y);
        const u1x = v1x / l1, u1y = v1y / l1;
        const n1x = u1y, n1y = -u1x;

        const v2x = pBase[0] - pElbow[0], v2y = pBase[1] - pElbow[1];
        const l2 = Math.hypot(v2x, v2y);
        const u2x = v2x / l2, u2y = v2y / l2;
        const n2x = u2y, n2y = -u2x;

        const dot = Math.max(-1, Math.min(1, (-u1x) * u2x + (-u1y) * u2y));
        const ang = Math.acos(dot);
        const dIn = r / Math.tan(ang / 2);
        const cInX = pElbow[0] - r * n1x - dIn * u1x;
        const cInY = pElbow[1] - r * n1y - dIn * u1y;
        const rFil = 0.45;
        const dFil = rFil / Math.tan(ang / 2);

        const rad = fmt(r);
        return [
          `M ${fmt(pGrip[0] + r * n1x)} ${fmt(pGrip[1] + r * n1y)}`,
          `L ${fmt(pElbow[0] + r * n1x)} ${fmt(pElbow[1] + r * n1y)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(pElbow[0] + r * n2x)} ${fmt(pElbow[1] + r * n2y)}`,
          `L ${fmt(pBase[0] + r * n2x)} ${fmt(pBase[1] + r * n2y)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(pBase[0] - r * n2x)} ${fmt(pBase[1] - r * n2y)}`,
          `L ${fmt(cInX + dFil * u2x)} ${fmt(cInY + dFil * u2y)}`,
          `A ${fmt(rFil)} ${fmt(rFil)} 0 0 0 ${fmt(cInX - dFil * u1x)} ${fmt(cInY - dFil * u1y)}`,
          `L ${fmt(pGrip[0] - r * n1x)} ${fmt(pGrip[1] - r * n1y)}`,
          `A ${rad} ${rad} 0 0 1 ${fmt(pGrip[0] + r * n1x)} ${fmt(pGrip[1] + r * n1y)} Z`
        ].join(" ");
      }

      /**
       * Comanda/ticket térmico con esquinas superiores redondeadas y 3 ondas circulares tangentes abajo
       * con offset interior exacto de 0.75 u ((rPeak - inset) + (rValley + inset) === rPeak + rValley).
       */
      function receiptTicketPath(xL, xR, yTop, yPeakCenter, rTop, rPeak, rValley, inset) {
        const ins = inset || 0;
        const c1x = xL + rPeak;
        const c5x = xR - rPeak;
        const stepX = (c5x - c1x) / 4;
        const sumR = rPeak + rValley;
        const dy = Math.sqrt(sumR * sumR - stepX * stepX);

        const p1 = [c1x, yPeakCenter];
        const v2 = [c1x + stepX, yPeakCenter + dy];
        const p3 = [c1x + 2 * stepX, yPeakCenter];
        const v4 = [c1x + 3 * stepX, yPeakCenter + dy];
        const p5 = [c5x, yPeakCenter];

        const rt = rTop - ins;
        const rp = rPeak - ins;
        const rv = rValley + ins;
        const xl = xL + ins;
        const xr = xR - ins;
        const yt = yTop + ins;

        const tang = (P, V) => {
          const frac = rp / (rp + rv);
          return [P[0] + frac * (V[0] - P[0]), P[1] + frac * (V[1] - P[1])];
        };

        const t54 = tang(p5, v4);
        const t34 = tang(p3, v4);
        const t32 = tang(p3, v2);
        const t12 = tang(p1, v2);

        return [
          `M ${fmt(xL + rTop)} ${fmt(yt)}`,
          `L ${fmt(xR - rTop)} ${fmt(yt)}`,
          `A ${fmt(rt)} ${fmt(rt)} 0 0 1 ${fmt(xr)} ${fmt(yTop + rTop)}`,
          `L ${fmt(xr)} ${fmt(yPeakCenter)}`,
          `A ${fmt(rp)} ${fmt(rp)} 0 0 1 ${fmt(t54[0])} ${fmt(t54[1])}`,
          `A ${fmt(rv)} ${fmt(rv)} 0 0 0 ${fmt(t34[0])} ${fmt(t34[1])}`,
          `A ${fmt(rp)} ${fmt(rp)} 0 0 1 ${fmt(t32[0])} ${fmt(t32[1])}`,
          `A ${fmt(rv)} ${fmt(rv)} 0 0 0 ${fmt(t12[0])} ${fmt(t12[1])}`,
          `A ${fmt(rp)} ${fmt(rp)} 0 0 1 ${fmt(xl)} ${fmt(yPeakCenter)}`,
          `L ${fmt(xl)} ${fmt(yTop + rTop)}`,
          `A ${fmt(rt)} ${fmt(rt)} 0 0 1 ${fmt(xL + rTop)} ${fmt(yt)} Z`
        ].join(" ");
      }

      /**
       * Cúpula abovedada clásica de horno de leña con offset paralelo interior exacto.
       */
      function archDomePath(cx, ySpring, R, yBot, rBot, inset) {
        const ins = inset || 0;
        const rArch = R - ins;
        const rb = rBot - ins;
        const xl = cx - R + ins;
        const xr = cx + R - ins;
        const yb = yBot - ins;
        return [
          `M ${fmt(xl)} ${fmt(ySpring)}`,
          `A ${fmt(rArch)} ${fmt(rArch)} 0 0 1 ${fmt(xr)} ${fmt(ySpring)}`,
          `L ${fmt(xr)} ${fmt(yBot - rBot)}`,
          `A ${fmt(rb)} ${fmt(rb)} 0 0 1 ${fmt(cx + R - rBot)} ${fmt(yb)}`,
          `L ${fmt(cx - R + rBot)} ${fmt(yb)}`,
          `A ${fmt(rb)} ${fmt(rb)} 0 0 1 ${fmt(xl)} ${fmt(yBot - rBot)} Z`
        ].join(" ");
      }

      function roundedSectorPath(ax, ay, R, centerDeg, halfDeg, rTip, rCorner, inset) {
        const ins = inset || 0;
        const tc = centerDeg * DEG;
        const alpha = halfDeg * DEG;
        const t1 = tc - alpha;
        const t2 = tc + alpha;
        const e1x = Math.cos(t1), e1y = Math.sin(t1);
        const e2x = Math.cos(t2), e2y = Math.sin(t2);
        const ecx = Math.cos(tc), ecy = Math.sin(tc);
        const n1x = -e1y, n1y = e1x;
        const n2x = e2y, n2y = -e2x;

        const dTip = rTip / Math.sin(alpha);
        const pTipX = ax + dTip * ecx, pTipY = ay + dTip * ecy;
        const rt = rTip - ins;
        const tip2X = pTipX - rt * n2x, tip2Y = pTipY - rt * n2y;
        const tip1X = pTipX - rt * n1x, tip1Y = pTipY - rt * n1y;

        const tRay = Math.sqrt((R - rCorner) * (R - rCorner) - rCorner * rCorner);
        const rc = rCorner - ins;
        const rArc = R - ins;

        const p1X = ax + tRay * e1x + rCorner * n1x, p1Y = ay + tRay * e1y + rCorner * n1y;
        const u1x = (p1X - ax) / (R - rCorner), u1y = (p1Y - ay) / (R - rCorner);
        const p2X = ax + tRay * e2x + rCorner * n2x, p2Y = ay + tRay * e2y + rCorner * n2y;
        const u2x = (p2X - ax) / (R - rCorner), u2y = (p2Y - ay) / (R - rCorner);

        return [
          `M ${fmt(tip2X)} ${fmt(tip2Y)}`,
          `A ${fmt(rt)} ${fmt(rt)} 0 0 1 ${fmt(tip1X)} ${fmt(tip1Y)}`,
          `L ${fmt(p1X - rc * n1x)} ${fmt(p1Y - rc * n1y)}`,
          `A ${fmt(rc)} ${fmt(rc)} 0 0 1 ${fmt(ax + rArc * u1x)} ${fmt(ay + rArc * u1y)}`,
          `A ${fmt(rArc)} ${fmt(rArc)} 0 0 1 ${fmt(ax + rArc * u2x)} ${fmt(ay + rArc * u2y)}`,
          `A ${fmt(rc)} ${fmt(rc)} 0 0 1 ${fmt(p2X - rc * n2x)} ${fmt(p2Y - rc * n2y)} Z`
        ].join(" ");
      }

      function annularCrustPath(ax, ay, rMid, halfThick, centerDeg, halfDeg, rCorner) {
        const rIn = rMid - halfThick;
        const rOut = rMid + halfThick;
        const tc = centerDeg * DEG;
        const alpha = halfDeg * DEG;
        const t1 = tc - alpha, t2 = tc + alpha;
        const e1x = Math.cos(t1), e1y = Math.sin(t1);
        const e2x = Math.cos(t2), e2y = Math.sin(t2);
        const n1x = -e1y, n1y = e1x;
        const n2x = e2y, n2y = -e2x;
        const tOut = Math.sqrt((rOut - rCorner) * (rOut - rCorner) - rCorner * rCorner);
        const tIn = Math.sqrt((rIn + rCorner) * (rIn + rCorner) - rCorner * rCorner);

        const pOut1X = ax + tOut * e1x + rCorner * n1x, pOut1Y = ay + tOut * e1y + rCorner * n1y;
        const uOut1X = (pOut1X - ax) / (rOut - rCorner), uOut1Y = (pOut1Y - ay) / (rOut - rCorner);
        const pOut2X = ax + tOut * e2x + rCorner * n2x, pOut2Y = ay + tOut * e2y + rCorner * n2y;
        const uOut2X = (pOut2X - ax) / (rOut - rCorner), uOut2Y = (pOut2Y - ay) / (rOut - rCorner);

        const pIn2X = ax + tIn * e2x + rCorner * n2x, pIn2Y = ay + tIn * e2y + rCorner * n2y;
        const uIn2X = (pIn2X - ax) / (rIn + rCorner), uIn2Y = (pIn2Y - ay) / (rIn + rCorner);
        const pIn1X = ax + tIn * e1x + rCorner * n1x, pIn1Y = ay + tIn * e1y + rCorner * n1y;
        const uIn1X = (pIn1X - ax) / (rIn + rCorner), uIn1Y = (pIn1Y - ay) / (rIn + rCorner);

        const rc = fmt(rCorner);
        return [
          `M ${fmt(ax + tIn * e1x)} ${fmt(ay + tIn * e1y)}`,
          `L ${fmt(ax + tOut * e1x)} ${fmt(ay + tOut * e1y)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(ax + rOut * uOut1X)} ${fmt(ay + rOut * uOut1Y)}`,
          `A ${fmt(rOut)} ${fmt(rOut)} 0 0 1 ${fmt(ax + rOut * uOut2X)} ${fmt(ay + rOut * uOut2Y)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(ax + tOut * e2x)} ${fmt(ay + tOut * e2y)}`,
          `L ${fmt(ax + tIn * e2x)} ${fmt(ay + tIn * e2y)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(ax + rIn * uIn2X)} ${fmt(ay + rIn * uIn2Y)}`,
          `A ${fmt(rIn)} ${fmt(rIn)} 0 0 0 ${fmt(ax + rIn * uIn1X)} ${fmt(ay + rIn * uIn1Y)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(ax + tIn * e1x)} ${fmt(ay + tIn * e1y)} Z`
        ].join(" ");
      }

      // Definición geométrica exacta de los 4 iconos del giro en viewBox 0 0 24 24 (cero stroke)
      const GEOMETRY = {
        moto: (function () {
          const rearWheel = circlePath(6.3, 17.5, 2.65);
          const frontWheel = circlePath(17.7, 17.5, 2.65);
          const handlebar = bentHandlebarPath([13.0, 7.2], [15.2, 7.2], [17.3, 16.3], 0.98);
          const headlamp = capsulePath(15.5, 8.5, 16.95, 8.5, 0.85);
          const deliveryBox = roundedRectPath(3.1, 6.8, 6.3, 5.6, 1.55);

          const bodyPts = [
            [3.2, 17.2],
            [3.2, 11.4],
            [10.3, 11.4],
            [10.3, 14.8],
            [13.7, 14.8],
            [15.2, 9.8],
            [20.6, 13.5],
            [20.6, 17.2]
          ];
          const bodyRadii = [1.4, 2.05, 1.35, 0.95, 1.05, 1.55, 2.55, 1.35];
          const glassOuter = roundedPolyPath(bodyPts, bodyRadii, 0);
          const glassInner = roundedPolyPath(bodyPts, bodyRadii, 0.75);
          const trimPill = capsulePath(5.1, 13.5, 8.2, 13.5, 0.65);

          return {
            label: "Moto reparto",
            shortLabel: "Moto",
            backPaths: [rearWheel, frontWheel, handlebar, headlamp, deliveryBox],
            glassPath: glassOuter,
            bevelPath: `${glassOuter} ${glassInner}`,
            frontPaths: [trimPill],
            bevelGrad: { y1: 9.8, y2: 17.2 },
            pivot: [6.3, 17.5],
            impulse: { dx: 0.35, dy: -1.15, rot: -4.8, backScale: -0.15 }
          };
        })(),

        printer: (function () {
          const printerBody = roundedRectPath(2.8, 10.2, 18.4, 10.3, 2.8);
          const ticketOuter = receiptTicketPath(6.0, 18.0, 2.6, 14.55, 1.85, 1.32, 1.18, 0);
          const ticketInner = receiptTicketPath(6.0, 18.0, 2.6, 14.55, 1.85, 1.32, 1.18, 0.75);
          const line1 = capsulePath(8.9, 6.0, 15.1, 6.0, 0.70);
          const line2 = capsulePath(8.9, 8.65, 13.4, 8.65, 0.70);

          return {
            label: "Ticket impresora",
            shortLabel: "Ticket",
            backPaths: [printerBody],
            glassPath: ticketOuter,
            bevelPath: `${ticketOuter} ${ticketInner}`,
            frontPaths: [line1, line2],
            bevelGrad: { y1: 2.6, y2: 15.8 },
            pivot: [12.0, 12.0],
            impulse: { dx: 0, dy: -1.85, rot: 0, backScale: -0.22 }
          };
        })(),

        oven: (function () {
          const hearthBase = roundedRectPath(2.5, 17.0, 19.0, 3.7, 1.85);
          const chimney = roundedRectPath(15.4, 2.6, 3.4, 6.0, 1.45);
          const domeOuter = archDomePath(12.0, 12.7, 8.5, 18.4, 1.65, 0);
          const domeInner = archDomePath(12.0, 12.7, 8.5, 18.4, 1.65, 0.75);

          // Flama orgánica viva asimétrica (lengua principal + lengua lateral redondeada, cero trazos)
          const flame = [
            "M 12.05 16.65",
            "C 10.02 16.65 8.95 15.28 8.95 13.60",
            "C 8.95 12.42 9.44 11.45 10.08 10.78",
            "C 10.32 10.52 10.72 10.68 10.69 11.05",
            "C 10.66 11.46 10.80 11.86 11.12 11.90",
            "C 11.42 11.94 11.58 11.52 11.70 11.00",
            "C 11.90 10.02 12.24 8.98 12.70 8.38",
            "C 12.95 8.06 13.42 8.20 13.48 8.62",
            "C 13.75 10.42 15.05 11.68 15.05 13.62",
            "C 15.05 15.32 13.92 16.65 12.05 16.65 Z"
          ].join(" ");

          return {
            label: "Horno y fuego",
            shortLabel: "Horno",
            backPaths: [hearthBase, chimney],
            glassPath: domeOuter,
            bevelPath: `${domeOuter} ${domeInner}`,
            frontPaths: [flame],
            flameAnim: true,
            bevelGrad: { y1: 4.2, y2: 18.4 },
            pivot: [12.0, 12.7],
            impulse: { dx: 0, dy: -0.75, rot: 0, backScale: -0.25 }
          };
        })(),

        slice: (function () {
          const ax = 1.1, ay = 22.9;
          const glassOuter = roundedSectorPath(ax, ay, 18.0, -45, 26.5, 1.55, 1.45, 0);
          const glassInner = roundedSectorPath(ax, ay, 18.0, -45, 26.5, 1.55, 1.45, 0.75);
          const crust = annularCrustPath(ax, ay, 18.5, 2.1, -45, 28.0, 1.72);
          const backSlice = roundedSectorPath(ax, ay, 16.5, -54.0, 21.5, 1.85, 1.25, 0);
          const pep1 = circlePath(7.35, 17.05, 1.24);
          const pep2 = circlePath(8.75, 11.82, 1.34);
          const pep3 = circlePath(12.78, 15.42, 1.28);
          return {
            label: "Pizza",
            shortLabel: "Pizza",
            backPaths: [crust, backSlice],
            glassPath: glassOuter,
            bevelPath: `${glassOuter} ${glassInner}`,
            frontPaths: [pep1, pep2, pep3],
            bevelGrad: { y1: 3.4, y2: 21.6 },
            pivot: [12, 12],
            impulse: { dx: 1.55, dy: -1.55, rot: -4.5, backScale: -0.28 }
          };
        })()
      };

      let uidCounter = 0;

      function buildGlassSVG(variantKey, sizePx, uidPrefix, cleanExport) {
        const g = GEOMETRY[variantKey];
        const uid = cleanExport ? `sarchi-glass-${variantKey}` : `${uidPrefix}-${++uidCounter}`;
        const backMarkup = g.backPaths.map((d) => `<path d="${d}" fill="url(#${uid}-obs)" />`).join("");
        const frontCls = !cleanExport && g.flameAnim ? ` class="js-flame-xf"` : "";
        const frontInner = g.frontPaths.map((d) => `<path d="${d}" fill="url(#${uid}-obs)" />`).join("");
        const frontMarkup = frontCls ? `<g${frontCls}>${frontInner}</g>` : frontInner;
        const glassCls = cleanExport ? "" : ` class="js-glass-xf"`;
        const backCls = cleanExport ? "" : ` class="js-back-xf"`;

        return [
          `<svg xmlns="http://www.w3.org/2000/svg" width="${sizePx}" height="${sizePx}" viewBox="0 0 24 24" fill="none"${cleanExport ? "" : ` data-svg-variant="${variantKey}"`}>`,
          `<defs>`,
          `<linearGradient id="${uid}-obs" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#5b5b5e" />`,
          `<stop offset="100%" stop-color="#161617" />`,
          `</linearGradient>`,
          `<linearGradient id="${uid}-glass" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#e3e3e5" stop-opacity="0.64" />`,
          `<stop offset="100%" stop-color="#bbbbc0" stop-opacity="0.62" />`,
          `</linearGradient>`,
          `<linearGradient id="${uid}-bevel" x1="12" y1="${g.bevelGrad.y1}" x2="12" y2="${g.bevelGrad.y2}" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />`,
          `<stop offset="58%" stop-color="#ffffff" stop-opacity="0.26" />`,
          `<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />`,
          `</linearGradient>`,
          `<filter id="${uid}-blur" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">`,
          `<feGaussianBlur stdDeviation="1.6" />`,
          `</filter>`,
          `<mask id="${uid}-out" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40">`,
          `<rect x="-8" y="-8" width="40" height="40" fill="#ffffff" />`,
          `<g${glassCls}><path d="${g.glassPath}" fill="#000000" /></g>`,
          `</mask>`,
          `<mask id="${uid}-in" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40">`,
          `<rect x="-8" y="-8" width="40" height="40" fill="#000000" />`,
          `<g${glassCls}><path d="${g.glassPath}" fill="#ffffff" /></g>`,
          `</mask>`,
          `</defs>`,
          `<g mask="url(#${uid}-out)"><g${backCls}>${backMarkup}</g></g>`,
          `<g mask="url(#${uid}-in)"><g filter="url(#${uid}-blur)"><g${backCls}>${backMarkup}</g></g></g>`,
          `<g${glassCls}>`,
          `<path d="${g.glassPath}" fill="url(#${uid}-glass)" />`,
          `<path d="${g.bevelPath}" fill="url(#${uid}-bevel)" fill-rule="evenodd" />`,
          frontMarkup,
          `</g>`,
          `</svg>`
        ].join("");
      }

      let activeVariant = "moto";
      let isDarkStage = false;
      let animFrameId = null;

      const stageEl = document.getElementById("glass-stage");
      const heroNameEl = document.getElementById("hero-variant-name");
      const heroShortEl = document.getElementById("hero-short-name");
      const slot96 = document.getElementById("slot-96");
      const slot48 = document.getElementById("slot-48");
      const slot40 = document.getElementById("slot-40");
      const slot32 = document.getElementById("slot-32");
      const slot24 = document.getElementById("slot-24");

      document.querySelectorAll("[data-mini-icon]").forEach((el) => {
        const v = el.getAttribute("data-mini-icon");
        el.innerHTML = buildGlassSVG(v, 18, "mini", false);
      });
      document.getElementById("family-moto").innerHTML = buildGlassSVG("moto", 48, "fam-moto", false);
      document.getElementById("family-printer").innerHTML = buildGlassSVG("printer", 48, "fam-printer", false);
      document.getElementById("family-oven").innerHTML = buildGlassSVG("oven", 48, "fam-oven", false);
      document.getElementById("family-slice").innerHTML = buildGlassSVG("slice", 48, "fam-slice", false);

      function renderActiveScaleSlots() {
        heroNameEl.textContent = GEOMETRY[activeVariant].label;
        heroShortEl.textContent = GEOMETRY[activeVariant].shortLabel;
        stageEl.setAttribute("aria-labelledby", `tab-${activeVariant}`);
        slot96.innerHTML = buildGlassSVG(activeVariant, 96, "s96", false);
        slot48.innerHTML = buildGlassSVG(activeVariant, 48, "s48", false);
        slot40.innerHTML = buildGlassSVG(activeVariant, 40, "s40", false);
        slot32.innerHTML = buildGlassSVG(activeVariant, 32, "s32", false);
        slot24.innerHTML = buildGlassSVG(activeVariant, 24, "s24", false);
      }

      function syncSelectionStyles() {
        document.querySelectorAll(".variant-tab").forEach((btn) => {
          const selected = btn.getAttribute("data-variant") === activeVariant;
          btn.setAttribute("aria-selected", selected ? "true" : "false");
          if (selected) {
            btn.className = "variant-tab focus-ring ui-btn-transition ui-text-xs min-[640px]:text-[13px] min-[640px]:leading-[20px] inline-flex items-center gap-1.5 px-2 min-[640px]:px-2.5 h-[32px] max-sm:min-h-[44px] rounded-[7px] font-medium cursor-pointer bg-[var(--background,#FFFFFF)] text-[var(--foreground,#09090B)] shadow-[0_1px_2px_rgba(9,9,11,0.06),0_0_0_1px_var(--card-border,#E4E4E7)]";
          } else {
            btn.className = "variant-tab focus-ring ui-btn-transition ui-text-xs min-[640px]:text-[13px] min-[640px]:leading-[20px] inline-flex items-center gap-1.5 px-2 min-[640px]:px-2.5 h-[32px] max-sm:min-h-[44px] rounded-[7px] font-medium cursor-pointer bg-transparent text-[var(--muted-foreground,#52525B)] hover:text-[var(--foreground,#09090B)]";
          }
        });

        document.querySelectorAll(".family-tile").forEach((tile) => {
          const selected = tile.getAttribute("data-pick") === activeVariant;
          tile.classList.toggle("glass-tile-active", selected);
        });
      }

      function triggerSpring() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const spec = GEOMETRY[activeVariant];
        const targetSvgs = stageEl.querySelectorAll(`svg[data-svg-variant="${activeVariant}"]`);
        const glassGroups = [];
        const backGroups = [];
        const flameGroups = [];
        targetSvgs.forEach((svg) => {
          svg.querySelectorAll(".js-glass-xf").forEach((node) => glassGroups.push(node));
          svg.querySelectorAll(".js-back-xf").forEach((node) => backGroups.push(node));
          svg.querySelectorAll(".js-flame-xf").forEach((node) => flameGroups.push(node));
        });

        let pos = 1.0;
        let vel = 4.4;
        const stiffness = 285;
        const damping = 14.0;
        let lastTs = performance.now();

        function step(now) {
          const dt = Math.min((now - lastTs) / 1000, 0.032);
          lastTs = now;

          const accel = -stiffness * pos - damping * vel;
          vel += accel * dt;
          pos += vel * dt;

          if (Math.abs(pos) < 0.002 && Math.abs(vel) < 0.01) {
            glassGroups.forEach((el) => el.removeAttribute("transform"));
            backGroups.forEach((el) => el.removeAttribute("transform"));
            flameGroups.forEach((el) => el.removeAttribute("transform"));
            animFrameId = null;
            return;
          }

          const dx = fmt(spec.impulse.dx * pos);
          const dy = fmt(spec.impulse.dy * pos);
          const rot = fmt(spec.impulse.rot * pos);
          const [px, py] = spec.pivot;
          const glassXf = `translate(${dx} ${dy}) rotate(${rot} ${px} ${py})`;

          const bdx = fmt(spec.impulse.dx * spec.impulse.backScale * pos);
          const bdy = fmt(spec.impulse.dy * spec.impulse.backScale * pos);
          const backXf = `translate(${bdx} ${bdy})`;

          for (let i = 0; i < glassGroups.length; i++) {
            glassGroups[i].setAttribute("transform", glassXf);
          }
          for (let i = 0; i < backGroups.length; i++) {
            backGroups[i].setAttribute("transform", backXf);
          }
          if (flameGroups.length > 0) {
            const sx = fmt(1 + 0.09 * pos);
            const sy = fmt(1 + 0.16 * pos);
            const fRot = fmt(-5.2 * pos);
            const flameXf = `translate(12 16.65) rotate(${fRot}) scale(${sx} ${sy}) translate(-12 -16.65)`;
            for (let i = 0; i < flameGroups.length; i++) {
              flameGroups[i].setAttribute("transform", flameXf);
            }
          }

          animFrameId = requestAnimationFrame(step);
        }

        animFrameId = requestAnimationFrame(step);
      }

      function selectVariant(nextVariant, animate) {
        if (!GEOMETRY[nextVariant]) return;
        activeVariant = nextVariant;
        syncSelectionStyles();
        renderActiveScaleSlots();
        if (animate) {
          triggerSpring();
        }
      }

      const tabOrder = ["moto", "printer", "oven", "slice"];
      document.querySelectorAll(".variant-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectVariant(btn.getAttribute("data-variant"), true);
        });
        btn.addEventListener("keydown", (ev) => {
          if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
          ev.preventDefault();
          const idx = tabOrder.indexOf(activeVariant);
          const nextIdx = ev.key === "ArrowRight"
            ? (idx + 1) % tabOrder.length
            : (idx - 1 + tabOrder.length) % tabOrder.length;
          const nextKey = tabOrder[nextIdx];
          selectVariant(nextKey, true);
          document.getElementById(`tab-${nextKey}`).focus();
        });
      });

      document.querySelectorAll(".family-tile").forEach((tile) => {
        tile.addEventListener("click", () => {
          selectVariant(tile.getAttribute("data-pick"), true);
        });
      });

      document.getElementById("hero-tile").addEventListener("click", () => {
        triggerSpring();
      });

      document.getElementById("btn-spring").addEventListener("click", () => {
        triggerSpring();
      });

      const btnSurface = document.getElementById("btn-surface");
      const surfaceLabel = document.getElementById("surface-label");
      const surfaceIcon = document.getElementById("surface-icon");
      btnSurface.addEventListener("click", () => {
        isDarkStage = !isDarkStage;
        btnSurface.setAttribute("aria-pressed", isDarkStage ? "true" : "false");
        stageEl.classList.toggle("stage-dark", isDarkStage);
        stageEl.classList.toggle("stage-light", !isDarkStage);
        if (isDarkStage) {
          surfaceLabel.textContent = "Fondo claro";
          surfaceIcon.innerHTML = `<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM4.22 5.64a1 1 0 0 1 1.42-1.42l1.41 1.42a1 1 0 1 1-1.41 1.41L4.22 5.64Zm12.73 12.72a1 1 0 0 1 1.41-1.41l1.42 1.41a1 1 0 1 1-1.42 1.42l-1.41-1.42ZM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Zm16 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1ZM5.64 19.78a1 1 0 0 1-1.42-1.42l1.42-1.41a1 1 0 1 1 1.41 1.41l-1.41 1.42ZM18.36 7.05a1 1 0 0 1-1.41-1.41l1.41-1.42a1 1 0 1 1 1.42 1.42l-1.42 1.41Z" />`;
        } else {
          surfaceLabel.textContent = "Fondo oscuro";
          surfaceIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" />`;
        }
      });

      let copyTimer = null;
      const btnCopy = document.getElementById("btn-copy");
      const copyLabel = document.getElementById("copy-label");
      const copyIcon = document.getElementById("copy-icon");

      function fallbackCopyText(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      btnCopy.addEventListener("click", async () => {
        const cleanSvg = buildGlassSVG(activeVariant, 24, "export", true);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(cleanSvg);
          } else {
            fallbackCopyText(cleanSvg);
          }
        } catch (_err) {
          fallbackCopyText(cleanSvg);
        }

        copyLabel.textContent = "SVG copiado";
        copyIcon.innerHTML = `<path d="M9.55 18.2 3.85 12.5l1.42-1.42 4.28 4.29 9.18-9.19 1.42 1.42-10.6 10.6Z" />`;
        if (copyTimer) clearTimeout(copyTimer);
        copyTimer = setTimeout(() => {
          copyLabel.textContent = "Copiar SVG";
          copyIcon.innerHTML = `<path d="M16 1H6C4.9 1 4 1.9 4 3v12h2V3h10V1Zm3 4H10C8.9 5 8 5.9 8 7v14c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H10V7h9v14Z" />`;
        }, 1800);
      });

      window.addEventListener("themechange", () => {
        const hostDark = document.documentElement.classList.contains("dark");
        if (hostDark !== isDarkStage) {
          btnSurface.click();
        }
      });

      renderActiveScaleSlots();
    })();
  </script>
</body>
</html>
