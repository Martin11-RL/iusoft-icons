<body class="antialiased">
  <div class="px-3 py-1.5 space-y-2 max-w-full overflow-x-hidden">

          >
            <span class="ui-text-xs tile-caption num-lock font-mono self-end">48 px</span>
            <span id="family-slice" class="w-[48px] h-[48px] flex items-center justify-center"></span>
            <span class="ui-text-xs tile-caption font-medium whitespace-nowrap">Rebanada</span>
          </button>

            data-pick="whole"
            aria-label="Seleccionar Pizza entera en mosaico de 48 píxeles"
            class="family-tile glass-tile focus-ring ui-btn-transition rounded-[14px] h-[96px] min-[520px]:h-[160px] px-1 min-[520px]:px-2 py-1.5 min-[520px]:py-2.5 flex flex-col items-center justify-between cursor-pointer"
          >
            <span class="ui-text-xs tile-caption num-lock font-mono self-end">48 px</span>
            <span id="family-whole" class="w-[48px] h-[48px] flex items-center justify-center"></span>
            <span class="ui-text-xs tile-caption font-medium whitespace-nowrap">Pizza entera</span>
          </button>

          <button
            type="button"
            data-pick="cutter"
            aria-label="Seleccionar Cortador en mosaico de 48 píxeles"
            class="family-tile glass-tile focus-ring ui-btn-transition rounded-[14px] h-[96px] min-[520px]:h-[160px] px-1.5 min-[520px]:px-2 py-1.5 min-[520px]:py-2.5 flex flex-col items-center justify-between cursor-pointer"
          >
            <span class="ui-text-xs tile-caption num-lock font-mono self-end">48 px</span>
            <span id="family-cutter" class="w-[48px] h-[48px] flex items-center justify-center"></span>
            <span class="ui-text-xs tile-caption font-medium whitespace-nowrap">Cortador</span>
          </button>
        </div>

        <!-- Matriz de prueba óptica multiescala: 48 px, 40 px, 32 px, 24 px -->
        <div class="order-2 min-[520px]:order-3 grid grid-cols-2 grid-rows-2 gap-1.5 min-[520px]:gap-2 h-[138px] min-[520px]:h-[160px]" aria-label="Prueba óptica de escalas en píxeles">
          <div class="glass-tile rounded-[12px] px-1.5 py-1 min-[520px]:px-2 min-[520px]:py-1.5 flex flex-row min-[520px]:flex-col items-center justify-center min-[520px]:justify-between gap-1.5 min-[520px]:gap-0">
            <span id="slot-48" class="w-[48px] h-[48px] flex items-center justify-center shrink-0 min-[520px]:my-auto"></span>
            <span class="ui-text-xs tile-caption num-lock font-mono">48 px</span>
          </div>
          <div class="glass-tile rounded-[12px] px-1.5 py-1 min-[520px]:px-2 min-[520px]:py-1.5 flex flex-row min-[520px]:flex-col items-center justify-center min-[520px]:justify-between gap-1.5 min-[520px]:gap-0">
            <span id="slot-40" class="w-[40px] h-[40px] flex items-center justify-center shrink-0 min-[520px]:my-auto"></span>
            <span class="ui-text-xs tile-caption num-lock font-mono">40 px</span>
          </div>
          <div class="glass-tile rounded-[12px] px-1.5 py-1 min-[520px]:px-2 min-[520px]:py-1.5 flex flex-row min-[520px]:flex-col items-center justify-center min-[520px]:justify-between gap-1.5 min-[520px]:gap-0">
            <span id="slot-32" class="w-[32px] h-[32px] flex items-center justify-center shrink-0 min-[520px]:my-auto"></span>
            <span class="ui-text-xs tile-caption num-lock font-mono">32 px</span>
          </div>
          <div class="glass-tile rounded-[12px] px-1.5 py-1 min-[520px]:px-2 min-[520px]:py-1.5 flex flex-row min-[520px]:flex-col items-center justify-center min-[520px]:justify-between gap-1.5 min-[520px]:gap-0">
            <span id="slot-24" class="w-[24px] h-[24px] flex items-center justify-center shrink-0 min-[520px]:my-auto"></span>
            <span class="ui-text-xs tile-caption num-lock font-mono">24 px</span>
          </div>

      </div>
    </div>

    <!-- Pie técnico compacto -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5 ui-text-xs text-[var(--muted-foreground,#52525B)]">
      <span>Obsidiana <span class="font-mono num-lock">#5b5b5e–#161617</span> · Refracción <span class="num-lock">σ 1.6</span> · Cristal <span class="num-lock">62%</span> · Bisel <span class="font-mono num-lock">evenodd 0.75 u</span></span>
      <span class="font-mono num-lock">viewBox 0 0 24 24 · 0 trazos</span>
    </div>
  </div>

  <script>
    (function () {
      const DEG = Math.PI / 180;
      const fmt = (n) => Number(n.toFixed(3));

      function circlePath(cx, cy, r) {
        const x = fmt(cx);
        const yTop = fmt(cy - r);
        const yBot = fmt(cy + r);
        const rad = fmt(r);
        return `M ${x} ${yTop} A ${rad} ${rad} 0 1 1 ${x} ${yBot} A ${rad} ${rad} 0 1 1 ${x} ${yTop} Z`;
      }

      function capsulePath(x1, y1, x2, y2, r) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ex = dx / len;
        const ey = dy / len;
        const nx = -ey;
        const ny = ex;
        const b1x = fmt(x1 - r * nx);
        const b1y = fmt(y1 - r * ny);
        const b2x = fmt(x2 - r * nx);
        const b2y = fmt(y2 - r * ny);
        const a2x = fmt(x2 + r * nx);
        const a2y = fmt(y2 + r * ny);
        const a1x = fmt(x1 + r * nx);
        const a1y = fmt(y1 + r * ny);
        const rad = fmt(r);
        return `M ${b1x} ${b1y} L ${b2x} ${b2y} A ${rad} ${rad} 0 0 1 ${a2x} ${a2y} L ${a1x} ${a1y} A ${rad} ${rad} 0 0 1 ${b1x} ${b1y} Z`;
      }

      /**
       * Cuña circular con punta y esquinas redondeadas exactas + desplazamiento paralelo interior exacto (inset).
       * Todos los centros de curvatura permanecen invariantes al aplicar inset, garantizando espesor constante.
       */
      function roundedSectorPath(ax, ay, R, centerDeg, halfDeg, rTip, rCorner, inset) {
        const ins = inset || 0;
        const tc = centerDeg * DEG;
        const alpha = halfDeg * DEG;
        const t1 = tc - alpha;
        const t2 = tc + alpha;

        const e1x = Math.cos(t1), e1y = Math.sin(t1);
        const e2x = Math.cos(t2), e2y = Math.sin(t2);
        const ecx = Math.cos(tc), ecy = Math.sin(tc);

        // Normales unitarias hacia el interior de la cuña
        const n1x = -e1y, n1y = e1x;
        const n2x = e2y, n2y = -e2x;

        // Punta redondeada
        const dTip = rTip / Math.sin(alpha);
        const pTipX = ax + dTip * ecx;
        const pTipY = ay + dTip * ecy;
        const rt = rTip - ins;

        const tip2X = pTipX - rt * n2x;
        const tip2Y = pTipY - rt * n2y;
        const tip1X = pTipX - rt * n1x;
        const tip1Y = pTipY - rt * n1y;

        // Esquinas exteriores tangentes a los rayos y al arco de radio R
        const tRay = Math.sqrt((R - rCorner) * (R - rCorner) - rCorner * rCorner);
        const rc = rCorner - ins;
        const rArc = R - ins;

        const p1X = ax + tRay * e1x + rCorner * n1x;
        const p1Y = ay + tRay * e1y + rCorner * n1y;
        const c1RayX = p1X - rc * n1x;
        const c1RayY = p1Y - rc * n1y;
        const u1x = (p1X - ax) / (R - rCorner);
        const u1y = (p1Y - ay) / (R - rCorner);
        const c1ArcX = ax + rArc * u1x;
        const c1ArcY = ay + rArc * u1y;

        const p2X = ax + tRay * e2x + rCorner * n2x;
        const p2Y = ay + tRay * e2y + rCorner * n2y;
        const c2RayX = p2X - rc * n2x;
        const c2RayY = p2Y - rc * n2y;
        const u2x = (p2X - ax) / (R - rCorner);
        const u2y = (p2Y - ay) / (R - rCorner);
        const c2ArcX = ax + rArc * u2x;
        const c2ArcY = ay + rArc * u2y;

        return [
          `M ${fmt(tip2X)} ${fmt(tip2Y)}`,
          `A ${fmt(rt)} ${fmt(rt)} 0 0 1 ${fmt(tip1X)} ${fmt(tip1Y)}`,
          `L ${fmt(c1RayX)} ${fmt(c1RayY)}`,
          `A ${fmt(rc)} ${fmt(rc)} 0 0 1 ${fmt(c1ArcX)} ${fmt(c1ArcY)}`,
          `A ${fmt(rArc)} ${fmt(rArc)} 0 0 1 ${fmt(c2ArcX)} ${fmt(c2ArcY)}`,
          `A ${fmt(rc)} ${fmt(rc)} 0 0 1 ${fmt(c2RayX)} ${fmt(c2RayY)}`,
          `Z`
        ].join(" ");
      }

      /**
       * Banda anular redondeada para la costra trasera de obsidiana (rMid=18.5, halfThick=2.1, half=28°).
       */
      function annularCrustPath(ax, ay, rMid, halfThick, centerDeg, halfDeg, rCorner) {
        const rIn = rMid - halfThick;
        const rOut = rMid + halfThick;
        const tc = centerDeg * DEG;
        const alpha = halfDeg * DEG;
        const t1 = tc - alpha;
        const t2 = tc + alpha;

        const e1x = Math.cos(t1), e1y = Math.sin(t1);
        const e2x = Math.cos(t2), e2y = Math.sin(t2);
        const n1x = -e1y, n1y = e1x;
        const n2x = e2y, n2y = -e2x;

        const tOut = Math.sqrt((rOut - rCorner) * (rOut - rCorner) - rCorner * rCorner);
        const tIn = Math.sqrt((rIn + rCorner) * (rIn + rCorner) - rCorner * rCorner);

        const pOut1X = ax + tOut * e1x + rCorner * n1x;
        const pOut1Y = ay + tOut * e1y + rCorner * n1y;
        const out1RayX = ax + tOut * e1x;
        const out1RayY = ay + tOut * e1y;
        const uOut1X = (pOut1X - ax) / (rOut - rCorner);
        const uOut1Y = (pOut1Y - ay) / (rOut - rCorner);
        const out1ArcX = ax + rOut * uOut1X;
        const out1ArcY = ay + rOut * uOut1Y;

        const pOut2X = ax + tOut * e2x + rCorner * n2x;
        const pOut2Y = ay + tOut * e2y + rCorner * n2y;
        const out2RayX = ax + tOut * e2x;
        const out2RayY = ay + tOut * e2y;
        const uOut2X = (pOut2X - ax) / (rOut - rCorner);
        const uOut2Y = (pOut2Y - ay) / (rOut - rCorner);
        const out2ArcX = ax + rOut * uOut2X;
        const out2ArcY = ay + rOut * uOut2Y;

        const pIn2X = ax + tIn * e2x + rCorner * n2x;
        const pIn2Y = ay + tIn * e2y + rCorner * n2y;
        const in2RayX = ax + tIn * e2x;
        const in2RayY = ay + tIn * e2y;
        const uIn2X = (pIn2X - ax) / (rIn + rCorner);
        const uIn2Y = (pIn2Y - ay) / (rIn + rCorner);
        const in2ArcX = ax + rIn * uIn2X;
        const in2ArcY = ay + rIn * uIn2Y;

        const pIn1X = ax + tIn * e1x + rCorner * n1x;
        const pIn1Y = ay + tIn * e1y + rCorner * n1y;
        const in1RayX = ax + tIn * e1x;
        const in1RayY = ay + tIn * e1y;
        const uIn1X = (pIn1X - ax) / (rIn + rCorner);
        const uIn1Y = (pIn1Y - ay) / (rIn + rCorner);
        const in1ArcX = ax + rIn * uIn1X;
        const in1ArcY = ay + rIn * uIn1Y;

        const rc = fmt(rCorner);
        return [
          `M ${fmt(in1RayX)} ${fmt(in1RayY)}`,
          `L ${fmt(out1RayX)} ${fmt(out1RayY)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(out1ArcX)} ${fmt(out1ArcY)}`,
          `A ${fmt(rOut)} ${fmt(rOut)} 0 0 1 ${fmt(out2ArcX)} ${fmt(out2ArcY)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(out2RayX)} ${fmt(out2RayY)}`,
          `L ${fmt(in2RayX)} ${fmt(in2RayY)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(in2ArcX)} ${fmt(in2ArcY)}`,
          `A ${fmt(rIn)} ${fmt(rIn)} 0 0 0 ${fmt(in1ArcX)} ${fmt(in1ArcY)}`,
          `A ${rc} ${rc} 0 0 1 ${fmt(in1RayX)} ${fmt(in1RayY)}`,
          `Z`
        ].join(" ");
      }

      /**
       * Pastel 3/4 de obsidiana con esquinas exteriores redondeadas (rCorner=1.10) y muesca central suavizada.
       */
      function threeQuarterPiePath(cx, cy, R, gapCenterDeg, gapHalfDeg, rCorner, rNotch) {
        const tg = gapCenterDeg * DEG;
        const beta = gapHalfDeg * DEG;
        const tStart = tg + beta;
        const tEnd = tg - beta;

        const esX = Math.cos(tStart), esY = Math.sin(tStart);
        const eeX = Math.cos(tEnd), eeY = Math.sin(tEnd);
        const ugX = Math.cos(tg), ugY = Math.sin(tg);

        // Normales hacia el interior sólido del pastel
        const nsX = -esY, nsY = esX;
        const neX = eeY, neY = -eeX;

        const dNotch = rNotch / Math.sin(beta);
        const pNotchX = cx + dNotch * ugX;
        const pNotchY = cy + dNotch * ugY;
        const notchSX = pNotchX + rNotch * nsX;
        const notchSY = pNotchY + rNotch * nsY;
        const notchEX = pNotchX + rNotch * neX;
        const notchEY = pNotchY + rNotch * neY;

        const tRay = Math.sqrt((R - rCorner) * (R - rCorner) - rCorner * rCorner);
        const psX = cx + tRay * esX + rCorner * nsX;
        const psY = cy + tRay * esY + rCorner * nsY;
        const sRayX = cx + tRay * esX;
        const sRayY = cy + tRay * esY;
        const usX = (psX - cx) / (R - rCorner);
        const usY = (psY - cy) / (R - rCorner);
        const sArcX = cx + R * usX;
        const sArcY = cy + R * usY;

        const peX = cx + tRay * eeX + rCorner * neX;
        const peY = cy + tRay * eeY + rCorner * neY;
        const eRayX = cx + tRay * eeX;
        const eRayY = cy + tRay * eeY;
        const ueX = (peX - cx) / (R - rCorner);
        const ueY = (peY - cy) / (R - rCorner);
        const eArcX = cx + R * ueX;
        const eArcY = cy + R * ueY;

        return [
          `M ${fmt(notchSX)} ${fmt(notchSY)}`,
          `L ${fmt(sRayX)} ${fmt(sRayY)}`,
          `A ${fmt(rCorner)} ${fmt(rCorner)} 0 0 1 ${fmt(sArcX)} ${fmt(sArcY)}`,
          `A ${fmt(R)} ${fmt(R)} 0 1 1 ${fmt(eArcX)} ${fmt(eArcY)}`,
          `A ${fmt(rCorner)} ${fmt(rCorner)} 0 0 1 ${fmt(eRayX)} ${fmt(eRayY)}`,
          `L ${fmt(notchEX)} ${fmt(notchEY)}`,
          `A ${fmt(rNotch)} ${fmt(rNotch)} 0 0 0 ${fmt(notchSX)} ${fmt(notchSY)}`,
          `Z`
        ].join(" ");
      }

      // Geometrías precalculadas para las 3 variantes en viewBox 0 0 24 24 (cero trazos stroke)
      const GEOMETRY = {
        slice: (function () {
          const ax = 1.1, ay = 22.9;
          const glassOuter = roundedSectorPath(ax, ay, 18.0, -45, 26.5, 1.55, 1.45, 0);
          const glassInner = roundedSectorPath(ax, ay, 18.0, -45, 26.5, 1.55, 1.45, 0.75);
          const crust = annularCrustPath(ax, ay, 18.5, 2.1, -45, 28.0, 1.72);
          // Segunda rebanada desde el mismo ápice para integrarse suavemente con la costra sin asomar en la punta
          const backSlice = roundedSectorPath(ax, ay, 16.5, -54.0, 21.5, 1.85, 1.25, 0);
          const pep1 = circlePath(7.35, 17.05, 1.24);
          const pep2 = circlePath(8.75, 11.82, 1.34);
          const pep3 = circlePath(12.78, 15.42, 1.28);
          return {
            label: "Rebanada",
            backPaths: [crust, backSlice],
            glassPath: glassOuter,
            bevelPath: `${glassOuter} ${glassInner}`,
            frontPaths: [pep1, pep2, pep3],
            bevelGrad: { y1: 3.4, y2: 21.6 },
            pivot: [12, 12],
            impulse: { dx: 1.55, dy: -1.55, rot: -4.5, backScale: -0.28 }
          };
        })(),

        whole: (function () {
          const pie = threeQuarterPiePath(10.2, 13.8, 8.1, -45, 36, 1.10, 0.68);
          // Rebanada frontal desprendida con traslape central calibrado para refractar el vértice y los hombros del corte
          const ax = 9.75, ay = 14.25, R = 10.7;
          const glassOuter = roundedSectorPath(ax, ay, R, -45, 32.0, 0.98, 1.25, 0);
          const glassInner = roundedSectorPath(ax, ay, R, -45, 32.0, 0.98, 1.25, 0.75);
          const pep1 = circlePath(13.35, 9.15, 1.06);
          const pep2 = circlePath(16.05, 10.35, 1.06);
          return {
            label: "Pizza entera",
            backPaths: [pie],
            glassPath: glassOuter,
            bevelPath: `${glassOuter} ${glassInner}`,
            frontPaths: [pep1, pep2],
            bevelGrad: { y1: 3.5, y2: 14.8 },
            pivot: [14.0, 10.0],
            impulse: { dx: 1.85, dy: -1.85, rot: 4.0, backScale: -0.22 }
          };
        })(),

        cutter: (function () {
          const handle = capsulePath(14.4, 9.6, 4.6, 19.4, 1.75);
          const wheelOuter = circlePath(14.4, 9.6, 6.5);
          const wheelInner = circlePath(14.4, 9.6, 5.75);
          const rivet = circlePath(14.4, 9.6, 1.45);
          return {
            label: "Cortador",
            backPaths: [handle],
            glassPath: wheelOuter,
            bevelPath: `${wheelOuter} ${wheelInner}`,
            frontPaths: [rivet],
            bevelGrad: { y1: 3.1, y2: 16.1 },
            pivot: [14.4, 9.6],
            impulse: { dx: 1.15, dy: -1.15, rot: 22.0, backScale: -0.25 }
          };
        })()
      };

      let uidCounter = 0;

      function buildGlassSVG(variantKey, sizePx, uidPrefix, cleanExport) {
        const g = GEOMETRY[variantKey];
        const uid = cleanExport ? `glass-${variantKey}` : `${uidPrefix}-${++uidCounter}`;
        const backMarkup = g.backPaths.map((d) => `<path d="${d}" fill="url(#${uid}-obs)" />`).join("");
        const frontMarkup = g.frontPaths.map((d) => `<path d="${d}" fill="url(#${uid}-obs)" />`).join("");
        const glassCls = cleanExport ? "" : ` class="js-glass-xf"`;
        const backCls = cleanExport ? "" : ` class="js-back-xf"`;

        return [
          `<svg xmlns="http://www.w3.org/2000/svg" width="${sizePx}" height="${sizePx}" viewBox="0 0 24 24" fill="none"${cleanExport ? "" : ` data-svg-variant="${variantKey}"`}>`,
          `<defs>`,
          `<linearGradient id="${uid}-obs" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#5b5b5e" />`,
          `<stop offset="100%" stop-color="#161617" />`,
          `</linearGradient>`,
          `<linearGradient id="${uid}-glass" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#e3e3e5" stop-opacity="0.64" />`,
          `<stop offset="100%" stop-color="#bbbbc0" stop-opacity="0.62" />`,
          `</linearGradient>`,
          `<linearGradient id="${uid}-bevel" x1="12" y1="${g.bevelGrad.y1}" x2="12" y2="${g.bevelGrad.y2}" gradientUnits="userSpaceOnUse">`,
          `<stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />`,
          `<stop offset="58%" stop-color="#ffffff" stop-opacity="0.26" />`,
          `<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />`,
          `</linearGradient>`,
          `<filter id="${uid}-blur" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">`,
          `<feGaussianBlur stdDeviation="1.6" />`,
          `</filter>`,
          `<mask id="${uid}-out" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40">`,
          `<rect x="-8" y="-8" width="40" height="40" fill="#ffffff" />`,
          `<g${glassCls}><path d="${g.glassPath}" fill="#000000" /></g>`,
          `</mask>`,
          `<mask id="${uid}-in" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40">`,
          `<rect x="-8" y="-8" width="40" height="40" fill="#000000" />`,
          `<g${glassCls}><path d="${g.glassPath}" fill="#ffffff" /></g>`,
          `</mask>`,
          `</defs>`,
          `<g mask="url(#${uid}-out)"><g${backCls}>${backMarkup}</g></g>`,
          `<g mask="url(#${uid}-in)"><g filter="url(#${uid}-blur)"><g${backCls}>${backMarkup}</g></g></g>`,
          `<g${glassCls}>`,
          `<path d="${g.glassPath}" fill="url(#${uid}-glass)" />`,
          `<path d="${g.bevelPath}" fill="url(#${uid}-bevel)" fill-rule="evenodd" />`,
          frontMarkup,
          `</g>`,
          `</svg>`
        ].join("");
      }

      // Estado interactivo
      let activeVariant = "slice";
      let isDarkStage = false;
      let animFrameId = null;

      const stageEl = document.getElementById("glass-stage");
      const heroNameEl = document.getElementById("hero-variant-name");
      const slot96 = document.getElementById("slot-96");
      const slot48 = document.getElementById("slot-48");
      const slot40 = document.getElementById("slot-40");
      const slot32 = document.getElementById("slot-32");
      const slot24 = document.getElementById("slot-24");

      // Renderizar iconos fijos en tabs (18 px) y mosaico familiar (48 px)
      document.querySelectorAll("[data-mini-icon]").forEach((el) => {
        const v = el.getAttribute("data-mini-icon");
        el.innerHTML = buildGlassSVG(v, 18, "mini", false);
      });
      document.getElementById("family-slice").innerHTML = buildGlassSVG("slice", 48, "fam-slice", false);
      document.getElementById("family-whole").innerHTML = buildGlassSVG("whole", 48, "fam-whole", false);
      document.getElementById("family-cutter").innerHTML = buildGlassSVG("cutter", 48, "fam-cutter", false);

      function renderActiveScaleSlots() {
        heroNameEl.textContent = GEOMETRY[activeVariant].label;
        stageEl.setAttribute("aria-labelledby", `tab-${activeVariant}`);
        slot96.innerHTML = buildGlassSVG(activeVariant, 96, "s96", false);
        slot48.innerHTML = buildGlassSVG(activeVariant, 48, "s48", false);
        slot40.innerHTML = buildGlassSVG(activeVariant, 40, "s40", false);
        slot32.innerHTML = buildGlassSVG(activeVariant, 32, "s32", false);
        slot24.innerHTML = buildGlassSVG(activeVariant, 24, "s24", false);
      }

      function syncSelectionStyles() {
        document.querySelectorAll(".variant-tab").forEach((btn) => {
          const selected = btn.getAttribute("data-variant") === activeVariant;
          btn.setAttribute("aria-selected", selected ? "true" : "false");
          if (selected) {
            btn.className = "variant-tab focus-ring ui-btn-transition ui-text-sm inline-flex items-center gap-1.5 min-[520px]:gap-2 px-2 min-[520px]:px-2.5 h-[32px] max-sm:min-h-[44px] rounded-[7px] font-medium cursor-pointer bg-[var(--background,#FFFFFF)] text-[var(--foreground,#09090B)] shadow-[0_1px_2px_rgba(9,9,11,0.06),0_0_0_1px_var(--card-border,#E4E4E7)]";
          } else {
            btn.className = "variant-tab focus-ring ui-btn-transition ui-text-sm inline-flex items-center gap-1.5 min-[520px]:gap-2 px-2 min-[520px]:px-2.5 h-[32px] max-sm:min-h-[44px] rounded-[7px] font-medium cursor-pointer bg-transparent text-[var(--muted-foreground,#52525B)] hover:text-[var(--foreground,#09090B)]";
          }
        });

        document.querySelectorAll(".family-tile").forEach((tile) => {
          const selected = tile.getAttribute("data-pick") === activeVariant;
          tile.classList.toggle("glass-tile-active", selected);
        });
      }

      // Física de resorte amortiguado a 60fps sincronizando el cristal y sus máscaras de refracción
      function triggerSpring() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const spec = GEOMETRY[activeVariant];
        const targetSvgs = stageEl.querySelectorAll(`svg[data-svg-variant="${activeVariant}"]`);
        const glassGroups = [];
        const backGroups = [];
        targetSvgs.forEach((svg) => {
          svg.querySelectorAll(".js-glass-xf").forEach((node) => glassGroups.push(node));
          svg.querySelectorAll(".js-back-xf").forEach((node) => backGroups.push(node));
        });

        let pos = 1.0;
        let vel = 4.2;
        const stiffness = 290;
        const damping = 14.5;
        let lastTs = performance.now();

        function step(now) {
          const dt = Math.min((now - lastTs) / 1000, 0.032);
          lastTs = now;

          const accel = -stiffness * pos - damping * vel;
          vel += accel * dt;
          pos += vel * dt;

          if (Math.abs(pos) < 0.002 && Math.abs(vel) < 0.01) {
            glassGroups.forEach((el) => el.removeAttribute("transform"));
            backGroups.forEach((el) => el.removeAttribute("transform"));
            animFrameId = null;
            return;
          }

          const dx = fmt(spec.impulse.dx * pos);
          const dy = fmt(spec.impulse.dy * pos);
          const rot = fmt(spec.impulse.rot * pos);
          const [px, py] = spec.pivot;
          const glassXf = `translate(${dx} ${dy}) rotate(${rot} ${px} ${py})`;

          const bdx = fmt(spec.impulse.dx * spec.impulse.backScale * pos);
          const bdy = fmt(spec.impulse.dy * spec.impulse.backScale * pos);
          const backXf = `translate(${bdx} ${bdy})`;

          for (let i = 0; i < glassGroups.length; i++) {
            glassGroups[i].setAttribute("transform", glassXf);
          }
          for (let i = 0; i < backGroups.length; i++) {
            backGroups[i].setAttribute("transform", backXf);
          }

          animFrameId = requestAnimationFrame(step);
        }

        animFrameId = requestAnimationFrame(step);
      }

      function selectVariant(nextVariant, animate) {
        if (!GEOMETRY[nextVariant]) return;
        activeVariant = nextVariant;
        syncSelectionStyles();
        renderActiveScaleSlots();
        if (animate) {
          triggerSpring();
        }
      }

      // Eventos de tabs y navegación por teclado accesible (flechas izquierda/derecha)
      const tabOrder = ["slice", "whole", "cutter"];
      document.querySelectorAll(".variant-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectVariant(btn.getAttribute("data-variant"), true);
        });
        btn.addEventListener("keydown", (ev) => {
          if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
          ev.preventDefault();
          const idx = tabOrder.indexOf(activeVariant);
          const nextIdx = ev.key === "ArrowRight"
            ? (idx + 1) % tabOrder.length
            : (idx - 1 + tabOrder.length) % tabOrder.length;
          const nextKey = tabOrder[nextIdx];
          selectVariant(nextKey, true);
          document.getElementById(`tab-${nextKey}`).focus();
        });
      });

      document.querySelectorAll(".family-tile").forEach((tile) => {
        tile.addEventListener("click", () => {
          selectVariant(tile.getAttribute("data-pick"), true);
        });
      });

      document.getElementById("hero-tile").addEventListener("click", () => {
        triggerSpring();
      });

      document.getElementById("btn-spring").addEventListener("click", () => {
        triggerSpring();
      });

      // Interruptor Fondo claro / Fondo oscuro
      const btnSurface = document.getElementById("btn-surface");
      const surfaceLabel = document.getElementById("surface-label");
      const surfaceIcon = document.getElementById("surface-icon");
      btnSurface.addEventListener("click", () => {
        isDarkStage = !isDarkStage;
        btnSurface.setAttribute("aria-pressed", isDarkStage ? "true" : "false");
        stageEl.classList.toggle("stage-dark", isDarkStage);
        stageEl.classList.toggle("stage-light", !isDarkStage);
        if (isDarkStage) {
          surfaceLabel.textContent = "Fondo claro";
          surfaceIcon.innerHTML = `<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM4.22 5.64a1 1 0 0 1 1.42-1.42l1.41 1.42a1 1 0 1 1-1.41 1.41L4.22 5.64Zm12.73 12.72a1 1 0 0 1 1.41-1.41l1.42 1.41a1 1 0 1 1-1.42 1.42l-1.41-1.42ZM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Zm16 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1ZM5.64 19.78a1 1 0 0 1-1.42-1.42l1.42-1.41a1 1 0 1 1 1.41 1.41l-1.41 1.42ZM18.36 7.05a1 1 0 0 1-1.41-1.41l1.41-1.42a1 1 0 1 1 1.42 1.42l-1.42 1.41Z" />`;
        } else {
          surfaceLabel.textContent = "Fondo oscuro";
          surfaceIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" />`;
        }
      });

      // Copiar SVG 24×24 limpio
      let copyTimer = null;
      const btnCopy = document.getElementById("btn-copy");
      const copyLabel = document.getElementById("copy-label");
      const copyIcon = document.getElementById("copy-icon");

      function fallbackCopyText(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      btnCopy.addEventListener("click", async () => {
        const cleanSvg = buildGlassSVG(activeVariant, 24, "export", true);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(cleanSvg);
          } else {
            fallbackCopyText(cleanSvg);
          }
        } catch (_err) {
          fallbackCopyText(cleanSvg);
        }

        copyLabel.textContent = "SVG copiado";
        copyIcon.innerHTML = `<path d="M9.55 18.2 3.85 12.5l1.42-1.42 4.28 4.29 9.18-9.19 1.42 1.42-10.6 10.6Z" />`;
        if (copyTimer) clearTimeout(copyTimer);
        copyTimer = setTimeout(() => {
          copyLabel.textContent = "Copiar SVG";
          copyIcon.innerHTML = `<path d="M16 1H6C4.9 1 4 1.9 4 3v12h2V3h10V1Zm3 4H10C8.9 5 8 5.9 8 7v14c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H10V7h9v14Z" />`;
        }, 1800);
      });

      // Sincronización con el tema del host Antigravity si cambia en vivo
      window.addEventListener("themechange", () => {
        const hostDark = document.documentElement.classList.contains("dark");
        if (hostDark !== isDarkStage) {
          btnSurface.click();
        }
      });

      renderActiveScaleSlots();
    })();
  </script>
</body>
</html>
