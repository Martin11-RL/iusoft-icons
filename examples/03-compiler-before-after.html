      function triggerSpring() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        if (showRawMit) {
          return;
        }
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const spec = META[activeVariant];
        const targetSvgs = stageEl.querySelectorAll(`svg[data-svg-variant="${activeVariant}"]`);
        const glassGroups = [];
        const backGroups = [];
        targetSvgs.forEach((svg) => {
          svg.querySelectorAll(".js-glass-xf").forEach((node) => glassGroups.push(node));
          svg.querySelectorAll(".js-back-xf").forEach((node) => backGroups.push(node));
        });

        let pos = 1.0;
        let vel = 4.3;
        const stiffness = 285;
        const damping = 14.0;
        let lastTs = performance.now();

        function step(now) {
          const dt = Math.min((now - lastTs) / 1000, 0.032);
          lastTs = now;

          const accel = -stiffness * pos - damping * vel;
          vel += accel * dt;
          pos += vel * dt;

          if (Math.abs(pos) < 0.002 && Math.abs(vel) < 0.01) {
            glassGroups.forEach((el) => el.removeAttribute("transform"));
            backGroups.forEach((el) => el.removeAttribute("transform"));
            animFrameId = null;
            return;
          }

          const dx = fmt(spec.impulse.dx * pos);
          const dy = fmt(spec.impulse.dy * pos);
          const rot = fmt(spec.impulse.rot * pos);
          const [px, py] = spec.pivot;
          const glassXf = `translate(${dx} ${dy}) rotate(${rot} ${px} ${py})`;

          const bdx = fmt(spec.impulse.backDx * pos);
          const bdy = fmt(spec.impulse.backDy * pos);
          const backXf = `translate(${bdx} ${bdy})`;

          for (let i = 0; i < glassGroups.length; i++) {
            glassGroups[i].setAttribute("transform", glassXf);
          }
          for (let i = 0; i < backGroups.length; i++) {
            backGroups[i].setAttribute("transform", backXf);
          }

          animFrameId = requestAnimationFrame(step);
        }

        animFrameId = requestAnimationFrame(step);
      }

      window.addEventListener("themechange", () => {
        const hostDark = document.documentElement.classList.contains("dark");
        if (hostDark !== isDarkStage) {
          btnSurface.click();
        }
      });

      renderAllSlots();
    })();
  </script>
</body>
</html>
